<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:30px;
}
.container{
    max-width:600px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:30px;
}
.header{
    font-size:28px;
    color:#2E7D32;
    font-weight:bold;
}
.info{
    margin-top:25px;
    line-height:28px;
}
.button{
    display:inline-block;
    margin-top:30px;
    background:#2E7D32;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
}
.footer{
    margin-top:40px;
    font-size:13px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
🧘 Booking Confirmed
</div>

<p>Hello <b>{{name}}</b>,</p>

<p>
Your yoga class has been booked successfully.
</p>

<div class="info">

<b>Class</b><br>
{{class_name}}

<br><br>

<b>Instructor</b><br>
{{instructor}}

<br><br>

<b>Date</b><br>
{{date}}

<br><br>

<b>Duration</b><br>
{{duration}} Minutes

</div>

<a href="{{ meet_link }}" class="button">
    Join Yoga Class
</a>

<a class="button">
See You Soon
</a>

<div class="footer">

Thank you for choosing
<b>Yogbook</b> ❤️

</div>

</div>

</body>
</html>
