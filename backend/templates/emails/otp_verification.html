<!doctype html>
<html>

<head>
  <meta charset='utf-8'>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #1f2937
    }

    .wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px
    }

    .card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .08)
    }

    .hero {
      background: linear-gradient(135deg, #2D6A4F, #40916C);
      color: #fff;
      padding: 36px 30px;
      text-align: center
    }

    .content {
      padding: 30px;
      line-height: 1.7
    }

    .info {
      background: #f8fbf9;
      border: 1px solid #dceee4;
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: #2D6A4F;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px
    }

    .footer {
      background: #edf6f1;
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div class='wrapper'>
    <div class='card'>
      <div class='hero'>
        <h1>Verify Your Account</h1>
      </div>
      <div class='content'>
        <p>Use the OTP below to continue.</p>
        <div class='info' style='text-align:center;font-size:38px;font-weight:bold;letter-spacing:8px;'>{{otp}}</div>
        <p>This code expires in {{expiry}}. If you didn't request it, ignore this email.</p>
      </div>
      <div class='footer'>Never share your OTP with anyone.</div>
    </div>
  </div>
</body>

</html>
