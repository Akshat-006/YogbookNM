<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
  }
  .wrapper {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
  }
  .title {
    margin: 0;
    font-size: 24px;
  }
  .otp {
    margin: 24px 0;
    font-size: 42px;
    letter-spacing: 0.2em;
    font-weight: 700;
    color: #111827;
  }
  .note {
    margin-top: 20px;
    color: #475569;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1 class="title">Your Yogbook verification code</h1>
      <p class="note">Use the code below to complete your login.</p>
      <div class="otp">{{otp}}</div>
      <p class="note">This code expires in {{expiry}}. If you did not request it, simply ignore this message.</p>
    </div>
  </div>
</body>
</html>
