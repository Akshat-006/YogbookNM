<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:30px;
}
.container{
    max-width:600px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:30px;
}
.header{
    font-size:28px;
    color:#2E7D32;
    font-weight:bold;
}
.info{
    margin-top:25px;
    line-height:28px;
}
.button{
    display:inline-block;
    margin-top:30px;
    background:#feffaf;
    color:rgb(0, 0, 0);
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
}
.footer{
    margin-top:40px;
    font-size:13px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
📅 Appointment Confirmed
</div>

<p>Hello <b>{{name}}</b>,</p>

<p>
Your yoga appointment has been confirmed.
</p>

<div class="info">

<b>Date & Time</b><br>
{{appointment_date}}

<br><br>

<b>Join Meeting</b><br>

<a href="{{meet_link}}" class="button">
Join Appointment
</a>

</div>

<div class="footer">

Thank you for choosing
<b>Yogbook</b> ❤️

</div>

</div>

</body>
</html>
