<!doctype html>
<html>

<head>
  <meta charset='utf-8'>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #1f2937
    }

    .wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px
    }

    .card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .08)
    }

    .hero {
      background: linear-gradient(135deg, #2D6A4F, #40916C);
      color: #fff;
      padding: 36px 30px;
      text-align: center
    }

    .content {
      padding: 30px;
      line-height: 1.7
    }

    .info {
      background: #f8fbf9;
      border: 1px solid #dceee4;
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: #2D6A4F;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px
    }

    .footer {
      background: #edf6f1;
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px
    }
  </style>
</head>

<body>
  <div class='wrapper'>
    <div class='card'>
      <div class='hero'>
        <h1>Appointment Confirmed</h1>
        <p>Your yoga session is successfully booked.</p>
      </div>
      <div class='content'>
        <p>Hello <b>{{name}}</b>,</p>
        <div class='info'><b>Date:</b> {{appointment_date}}<br><b>Time:</b> {{appointment_time_12h}}<br><b>Timezone:</b>
          {{timezone}}</div><a class='btn' href='{{meet_link}}'>Join Appointment</a> <a class='btn'
          href='{{frontend_base_url}}/dashboard'>Dashboard</a>
      </div>
      <div class='footer'>© 2026 Yogbook • Stay Balanced • support@yogbook.com</div>
    </div>
  </div>
</body>

</html>
